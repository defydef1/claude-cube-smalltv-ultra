[platformio]
default_envs = ultra

; Claude Cube — custom firmware for GeekMagic SmallTV-Ultra (ESP8266, ST7789 240x240)
[env:ultra]
platform = espressif8266
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m3m.ld
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI
  bodmer/TJpg_Decoder
  bblanchon/ArduinoJson@^7
  https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=-1
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_SPI_MODE=SPI_MODE3
  -D TFT_INVERSION_ON=1
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  ; u8g2 fonts live in RAM on ESP8266 by default; move them to flash
  -include pgmspace.h
  '-D U8X8_FONT_SECTION(name)=__attribute__((section(".irom.text." name)))'
  '-D u8x8_pgm_read(adr)=pgm_read_byte(adr)'
  ; TJpg_Decoder defaults to SPIFFS; point it at LittleFS so SPIFFS isn't linked
  -D NO_GLOBAL_SPIFFS
  -D SPIFFS=LittleFS

; tiny OTA-only firmware used as a stepping stone for updates (tools/flash.sh)
[env:loader]
platform = espressif8266
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m3m.ld
build_src_filter = -<*> +<../loader/>
