<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a0a">
<title>Claude Cube</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;900&display=swap">
<style>
:root{--bg:#0b0a0a;--c1:#161413;--c2:#211e1c;--ln:#2e2a27;--fg:#f4efe8;--mu:#9a938b;--dm:#5f5953;--ac:#d97757;--a2:#f0a37f;--ok:#62c28d;--wa:#e3b24f;--bd:#e0625a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.4 Montserrat,-apple-system,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
.lg{width:30px;height:30px;border-radius:9px;background:var(--ac);display:grid;place-items:center;box-shadow:0 0 22px #d9775750}
.lg i{width:11px;height:11px;border-radius:3px;background:#1d100b}
h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.2px}
.st{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mu);font-weight:600}
.dt{width:8px;height:8px;border-radius:50%;background:var(--dm)}.dt.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0b0a0aee;backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
nav button{flex:1;max-width:130px;border:0;background:none;color:var(--mu);padding:8px 4px;border-radius:12px;font-weight:700;font-size:13px}
nav button.on{background:var(--c2);color:var(--fg)}
nav b{display:block;font-size:17px;line-height:1.2;color:var(--ac)}
.card{background:var(--c1);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
h2{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mu)}
.btn{border:1px solid var(--ln);background:var(--c2);border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.btn:disabled{opacity:.4}
.btn.p{background:var(--ac);border-color:var(--ac);color:#1d100b}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g4 .btn,.g3 .btn{padding:10px 4px;font-size:13px}
label,.lb{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);font-weight:600;margin:12px 0 6px}
label b,.lb b{color:var(--fg)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--c2);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:var(--ln);outline:none;margin:8px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--fg);border:5px solid var(--c1);box-shadow:0 0 0 1px var(--ln)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.orow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}.orow:last-child{border:0}.orow span{flex:1}.orow small{display:block;color:var(--dm);font-size:12px}.orow.off b{color:var(--dm)}.orow .btn{padding:6px 11px}.orow input{width:20px;height:20px;accent-color:var(--ac)}
.two label{margin-top:4px}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);z-index:30;background:var(--c2);border:1px solid var(--ln);border-radius:14px;padding:10px 16px;font-size:13px;font-weight:600;transition:.25s;max-width:92vw;box-shadow:0 10px 30px #000a}
.toast.on{transform:translate(-50%,0)}.toast.ok{border-color:#2f5c43}.toast.er{border-color:#7a302b;color:#f4aaa3}
/* editor */
.drop{border:1.5px dashed var(--ln);border-radius:16px;padding:34px 16px;text-align:center;cursor:pointer}
.drop b{display:block;font-size:17px;font-weight:800;margin:10px 0 4px}
.drop small{color:var(--mu)}
.drop i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto;border-radius:15px;background:var(--c2);color:var(--ac);font-style:normal;font-size:24px;font-weight:900}
.stage{position:relative;width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#000;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage .m{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none}
.stage .res{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:2}
.grid3{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:.2s;
 background:linear-gradient(90deg,transparent 33.2%,#fff5 0 33.5%,transparent 0 66.5%,#fff5 0 66.8%,transparent 0),linear-gradient(transparent 33.2%,#fff5 0 33.5%,transparent 0 66.5%,#fff5 0 66.8%,transparent 0)}
.stage.dr .grid3{opacity:1}
.bez{padding:12px;border-radius:22px;background:linear-gradient(160deg,#2b2826,#151312 60%);box-shadow:inset 0 1px 0 #ffffff12,0 18px 40px #000a}
.hint{font-size:12px;color:var(--dm);margin-top:8px;text-align:center}
.trk{position:relative;height:46px;margin-top:14px;border-radius:12px;background:var(--c2);border:1px solid var(--ln);overflow:hidden;touch-action:none}
.trk canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.sel{position:absolute;top:0;bottom:0;border-top:2px solid var(--ac);border-bottom:2px solid var(--ac);background:#d9775722}
.hd{position:absolute;top:0;bottom:0;width:18px;margin-left:-9px;z-index:2}
.hd:after{content:"";position:absolute;left:5px;right:5px;top:-1px;bottom:-1px;background:var(--ac);border-radius:4px}
.ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:3;pointer-events:none}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);font-weight:600;margin-top:6px}
.tm b{color:var(--fg)}.tm b.w{color:var(--wa)}
.meter{height:6px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.info{font-size:12px;color:var(--mu);margin-top:6px;font-weight:600}
.info b{color:var(--fg)}
/* files */
.fl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ti{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--c2);border:1px solid var(--ln)}
.ti img{width:100%;height:100%;object-fit:cover;display:block}
.ti span{position:absolute;left:5px;top:5px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:#000b}
.ti .ac{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;padding:5px;background:linear-gradient(transparent,#000d)}
.ti .ac button{flex:1;border:0;border-radius:8px;padding:6px 0;background:#ffffff26;backdrop-filter:blur(6px);font-size:11px;font-weight:700}
.ti .ac button+button{flex:0 0 32px}
</style></head><body>
<div class="wrap">
<header><div class="lg"><i></i></div><h1>Claude Cube</h1><div class="st"><span class="dt" id="dot"></span><span id="stx">…</span></div></header>

<section id="t0">
 <div class="card">
  <h2 data-i="img_title"></h2>
  <div class="drop" id="drop"><i>+</i><b data-i="drop_b"></b><small data-i="drop_s"></small></div>
  <div id="ed" hidden>
   <div class="bez"><div class="stage" id="stg"><div class="grid3"></div><img class="res" id="res" hidden alt=""></div></div>
   <div class="hint" id="hnt" data-i="hint_crop"></div>
   <div id="vid" hidden>
    <div class="trk" id="trk"><canvas id="film" width="320" height="46"></canvas><div class="sel" id="sel"></div><div class="hd" id="hi"></div><div class="hd" id="ho"></div><div class="ph" id="ph"></div></div>
    <div class="tm"><span><i data-i="from"></i> <b id="ti">0.0</b></span><span><i data-i="len"></i> <b id="tl">0.0</b></span><span><i data-i="to"></i> <b id="to">0.0</b></span></div>
    <div class="lb"><i data-i="fps"></i> <b id="fv">12</b></div><input type="range" id="fps" min="4" max="20" value="12">
    <div class="lb"><i data-i="maxlen"></i> <b id="mv">6</b></div><input type="range" id="mx" min="1" max="12" step=".5" value="6">
    <label style="justify-content:flex-start;gap:8px"><input type="checkbox" id="dith" checked> <i data-i="dith"></i></label>
   </div>
   <div id="img" hidden><div class="lb"><i data-i="quality"></i> <b id="qv">85</b></div><input type="range" id="q" min="50" max="95" value="85"></div>
   <div class="meter"><i id="bar"></i></div><div class="info" id="inf">&nbsp;</div>
   <div class="row" style="margin-top:12px"><button class="btn" id="bNew" data-i="other"></button><button class="btn" id="bMk" data-i="preview"></button><button class="btn p" id="bGo" data-i="send"></button></div>
  </div>
 </div>
 <div class="card"><h2 data-i="note"></h2>
  <textarea id="nt" rows="3" data-ip="note_ph"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn p" id="bNt" data-i="note_send"></button></div>
 </div>
 <div class="card"><h2 data-i="face"></h2><div class="g4" id="emo"></div></div>
 <div class="card"><h2 data-i="life"></h2>
  <canvas id="lp" width="240" height="240" style="width:100%;max-width:320px;display:block;margin:0 auto;border-radius:12px;touch-action:none"></canvas>
  <div class="lb"><i data-i="cells"></i> <b id="lc">0 / 60</b></div>
  <div class="row"><button class="btn" id="lClr" data-i="clear"></button><button class="btn p" id="lGo" style="flex:1" data-i="fight"></button></div>
  <div class="hint" id="lst" data-i="life_hint"></div>
 </div>
</section>

<section id="t1" hidden>
 <div class="card"><h2 data-i="on_cube"></h2>
  <div class="meter" style="margin:0 0 6px"><i id="fsb"></i></div><div class="info" id="fst" style="margin-bottom:14px">&nbsp;</div>
  <div class="fl" id="fl"></div>
 </div>
</section>

<section id="t2" hidden>
 <div class="card"><h2 data-i="brightness"></h2>
  <div class="lb"><i data-i="day"></i> <b id="bv"></b></div><input type="range" id="brt" min="1" max="100">
  <div class="lb"><i data-i="night"></i> <b id="nbv"></b></div><input type="range" id="nbrt" min="0" max="40">
  <div class="two"><div><label data-i="night_from"></label><input type="number" id="non" min="0" max="23"></div><div><label data-i="night_to"></label><input type="number" id="noff" min="0" max="23"></div></div>
 </div>
 <div class="card"><h2 data-i="screens"></h2>
  <div class="two"><div><label data-i="photo_sec"></label><input type="number" id="slide" min="2" max="120"></div><div><label data-i="wx_sec"></label><input type="number" id="wxsec" min="5" max="600"></div></div>
  <label data-i="cx_sec"></label><input type="number" id="cxsec" min="0" max="600">
  <label data-i="pairs"></label><input type="text" id="pairs" autocapitalize="characters" spellcheck="false" placeholder="USDTUAH,BTCUSDT">
 </div>
 <div class="card"><h2 data-i="order"></h2>
  <div id="ord"></div>
  <div class="hint" style="text-align:left" data-i="order_hint"></div>
 </div>
 <div class="card"><h2 data-i="test"></h2>
  <div class="g3" id="wx"></div>
  <div class="row" style="margin-top:8px"><button class="btn" data-s="alert=1" data-i="al_test"></button><button class="btn" data-s="alert=-1" data-i="al_real"></button></div>
  <div class="row" style="margin-top:8px"><button class="btn" id="bBgr" data-i="bgr"></button><button class="btn" id="bRot" data-i="rot"></button></div>
 </div>
 <div class="card"><h2 data-i="lang"></h2><select id="lang"></select></div>
 <div class="card"><h2 data-i="region"></h2>
  <label data-i="alert_reg"></label><select id="areg"></select>
  <div class="hint" style="text-align:left" data-i="weather_follows"></div>
  <label data-i="out_reg"></label><div class="two"><select id="outr"></select><select id="outg"></select></div>
  <div class="row" style="margin-top:8px"><button class="btn" data-s="screen=outage" data-i="show_out"></button></div>
  <label data-i="relay"></label><input type="text" id="relay" spellcheck="false" autocapitalize="off" placeholder="name.workers.dev">
  <div class="hint" style="text-align:left" data-i="relay_hint"></div>
 </div>
 <div class="card"><h2 data-i="system"></h2><div class="info" id="sys" style="margin:-4px 0 12px"></div>
  <div class="row"><a class="btn" href="/update" data-i="update"></a><button class="btn" id="bRb" data-i="reboot"></button></div>
 </div>
</section>
</div>

<nav><button class="on" data-t="0"><b>◐</b><span data-i="tab_cube"></span></button><button data-t="1"><b>▦</b><span data-i="tab_files"></span></button><button data-t="2"><b>⚙</b><span data-i="tab_set"></span></button></nav>
<div class="toast" id="tst"></div>
<input type="file" id="fi" accept="image/*,video/*,.heic,.gif" hidden>

<script>
/*I18N*/
let LG=(()=>{try{return localStorage.getItem('lang')}catch(e){}})()||LANGS[0];
const t=k=>((I18N[LG]||I18N[LANGS[0]])[k]??k);
function applyLang(){if(!I18N[LG])LG=LANGS[0];document.documentElement.lang=LG;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=t(e.dataset.ip));
 $('mv').textContent=MX()+' '+t('sec');buildButtons();if(ORD)drawOrd();if(C.lang)regionsUI()}
const $=i=>document.getElementById(i),KB=b=>(b/1024).toFixed(b<10240?1:0)+' '+t('kb'),W8=ms=>new Promise(r=>setTimeout(r,ms));
let C={},FS=null,tt;
function toast(t,c){const e=$('tst');e.textContent=t;e.className='toast on '+(c||'');clearTimeout(tt);tt=setTimeout(()=>e.className='toast',3200)}
const get=u=>fetch(u).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});
function set(q){return get('/set?'+q).then(()=>{toast(t('done'),'ok');status()}).catch(e=>toast(t('no_answer'),'er'))}

/* tabs */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));
 for(let i=0;i<3;i++)$('t'+i).hidden=i!=b.dataset.t;
 if(b.dataset.t==1)files();scrollTo(0,0)});

/* status + settings */
const KEYS=['brt','nbrt','non','noff','slide','wxsec','cxsec'];
function status(){return fetch('/status').then(r=>r.json()).then(s=>{
 C=s.cfg;FS=s;$('dot').className='dt on';$('stx').textContent=s.wx&&s.wx.ok?Math.round(s.wx.t)+'° · '+regName():t('online');
 if(C.lang&&C.lang!=LG&&I18N[C.lang]){LG=C.lang;try{localStorage.setItem('lang',LG)}catch(e){}applyLang()}
 if(C.langs&&!$('lang').options.length)C.langs.split(',').filter(l=>I18N[l]).forEach(l=>$('lang').add(new Option(I18N[l]._name,l)));$('lang').value=LG;
 KEYS.forEach(k=>{if(document.activeElement!=$(k))$(k).value=C[k]});
 $('bv').textContent=C.brt+'%';$('nbv').textContent=C.nbrt+'%';
 if(document.activeElement!=$('pairs'))$('pairs').value=C.pairs!=null?C.pairs:(C.coins||'');
 const fr=s.fsTotal-s.fsUsed;$('fst').innerHTML=t('free')+' <b>'+KB(fr)+'</b> '+t('of')+' '+(s.fsTotal/1048576).toFixed(1)+' '+t('mb');
 $('fsb').style.width=(s.fsUsed/s.fsTotal*100)+'%';$('fsb').style.background=fr<120e3?'var(--bd)':fr<300e3?'var(--wa)':'var(--ok)';
 loadOrd(C.order);regionsUI();lifeShow(s.life);if(s.life&&s.life.state!="idle"&&s.life.state!="over")lifePoll();
 $('sys').innerHTML=(s.fw||'')+' · '+t('memory')+' '+KB(s.heap||0)+' · '+(s.photos||0)+' '+t('nfiles');
}).catch(()=>{$('dot').className='dt';$('stx').textContent=t('offline')})}
/* regions: alerts from the built-in list, outages from the relay's /regions */
const regName=()=>{const n=(t('_regions')||[])[C.areg||0]||t('city');return n.toLowerCase().replace(/(^|[\s-])\S/g,m=>m.toUpperCase())};
let RG=null;
function regionsUI(){const a=$('areg');if(!a.options.length||a.dataset.lg!=LG){a.innerHTML='';a.dataset.lg=LG;
  t('_regions').forEach((n,i)=>a.add(new Option(n,i)))}
 if(document.activeElement!=a)a.value=C.areg||0;
 if(document.activeElement!=$('relay'))$('relay').value=C.relay||'';
 const r=$('outr'),g=$('outg');
 if(!RG&&C.relay){RG=[];fetch('http://'+C.relay+'/regions').then(x=>x.json()).then(l=>{RG=l;regionsUI()}).catch(()=>{RG=null})}
 if(document.activeElement==r||document.activeElement==g)return;
 r.innerHTML='';r.add(new Option(t('out_off'),'-'));if(C.outg&&!C.outr)r.add(new Option(t('out_yasno'),''));
 (RG||[]).forEach(x=>r.add(new Option(LG=='uk'||LG=='ru'?x.name:x.name_en,x.id)));
 r.value=!C.outg?'-':(C.outr||'');if(r.value===''&&C.outr)r.add(new Option(C.outr,C.outr)),r.value=C.outr;
 const reg=(RG||[]).find(x=>x.id==r.value);g.innerHTML='';
 (reg?reg.groups:C.outg?[C.outg]:[]).forEach(x=>g.add(new Option(x,x)));g.value=C.outg||'';g.disabled=r.value=='-'}
$('areg').onchange=()=>set('areg='+$('areg').value);
$('outr').onchange=()=>{const v=$('outr').value;if(v=='-')return set('outg=');const reg=(RG||[]).find(x=>x.id==v);
 set('outr='+encodeURIComponent(v)+'&outg='+encodeURIComponent(reg?reg.groups[0]:C.outg||''))};
$('outg').onchange=()=>set('outg='+encodeURIComponent($('outg').value));
$('relay').onchange=()=>{RG=null;set('relay='+encodeURIComponent($('relay').value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'')))};
$('lang').onchange=()=>{LG=$('lang').value;try{localStorage.setItem('lang',LG)}catch(e){}applyLang();set('lang='+LG)};
KEYS.forEach(k=>$(k).onchange=()=>set(k+'='+$(k).value));
$('brt').oninput=()=>$('bv').textContent=$('brt').value+'%';$('nbrt').oninput=()=>$('nbv').textContent=$('nbrt').value+'%';
/* rotation order: tick to include, arrows to move */
const SL={},SH={photos:'h_photos',pet:'h_pet',outage:'h_outage'};['weather','crypto','photos','pet','kyiv','outage'].forEach(k=>SL[k]='o_'+k);
let ORD=null;
function drawOrd(){const on=ORD.filter(x=>x[1]).map(x=>x[0]);$('ord').innerHTML='';
 ORD.forEach(([k,en],i)=>{const r=document.createElement('div');r.className='orow'+(en?'':' off');
  r.innerHTML='<input type="checkbox"'+(en?' checked':'')+'><span><b>'+(en?on.indexOf(k)+1+'. ':'')+t(SL[k])+'</b>'+(SH[k]?'<small>'+t(SH[k])+'</small>':'')+'</span><button class="btn">↑</button><button class="btn">↓</button>';
  const [cb,up,dn]=r.querySelectorAll('input,button');
  cb.onchange=()=>{ORD[i][1]=cb.checked;saveOrd()};
  up.onclick=()=>{if(i){[ORD[i-1],ORD[i]]=[ORD[i],ORD[i-1]];saveOrd()}};
  dn.onclick=()=>{if(i<ORD.length-1){[ORD[i+1],ORD[i]]=[ORD[i],ORD[i+1]];saveOrd()}};
  $('ord').appendChild(r)})}
function saveOrd(){drawOrd();set('order='+ORD.filter(x=>x[1]).map(x=>x[0]).join(','))}
function loadOrd(o){if(ORD||o==null)return;const on=o.split(',').filter(k=>SL[k]);
 ORD=on.map(k=>[k,true]).concat(Object.keys(SL).filter(k=>!on.includes(k)).map(k=>[k,false]));drawOrd()}
$('pairs').onchange=()=>{const v=$('pairs').value.toUpperCase().replace(/[^A-Z0-9,]/g,'');set(('coins' in C&&!('pairs' in C)?'coins=':'pairs=')+encodeURIComponent(v))};
function buildButtons(){$('wx').innerHTML='';$('emo').innerHTML='';
 [['w_sun',0],['w_cloud',3],['w_rain',63],['w_storm',95],['w_snow',73],['w_fog',45]].forEach(([n,c])=>{const b=document.createElement('button');b.className='btn';b.textContent=t(n);b.onclick=()=>set('wx='+c);$('wx').appendChild(b)});
 {const b=document.createElement('button');b.className='btn';b.style.gridColumn='1/-1';b.textContent=t('w_real');b.onclick=()=>set('wx=-1');$('wx').appendChild(b)}
 [['idle','e_idle'],['thinking','e_think'],['working','e_work'],['attention','e_attn'],['happy','e_happy'],['sad','e_sad'],['sleepy','e_sleep'],['love','e_love']].forEach(([e,k])=>{
